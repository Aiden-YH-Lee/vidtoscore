services:
  web:
    build: ./frontend
    ports:
      - 5173:5173
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - api
    develop:
      watch:
        - path: ./frontend/package*.json
          action: rebuild
        - path: ./frontend
          target: app/
          action: sync
  
  api:
    build: ./backend
    ports:
      - 8080:8080
    environment:
      - FLASK_APP=app.py
    develop:
      watch:
        - action: rebuild
          path: ./backend/requirements.txt
        - action: sync
          path: ./backend
          target: app/

    